[project]
name = "desk"
version = "0.2.3"
description = "Multi-agent trading research desk (SIM only). Phase 2: analysts, trader, risk rules, shadow ledger."
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.0",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "anthropic>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
charts = ["matplotlib>=3.8"]     # PNG for `desk performance`; without it an SVG is written instead

[project.scripts]
desk = "desk.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["desk*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
