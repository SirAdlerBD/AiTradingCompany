# Deterministic risk rules. Evaluated by code in desk/risk.py (phase 2).
# Each rule has a stable id; verdicts cite the id and the numbers, nothing else.
# Bump `version` on any change; runs record the version they used.
version: 1

rules:
  - id: MAX_POSITION_PCT
    description: Single position may not exceed this share of portfolio value.
    limit: 0.15
    on_breach: resize        # resize | veto

  - id: MAX_SECTOR_PCT
    description: Combined exposure to one FMP sector may not exceed this share.
    limit: 0.35
    on_breach: resize

  - id: MIN_CASH_PCT
    description: Keep at least this share in cash after the proposal.
    limit: 0.10
    on_breach: resize

  - id: MAX_CORR_TO_BOOK
    description: >
      Reject a new position whose 60-day daily-return correlation with the
      current book exceeds the limit. Needs return history in price_history.
    lookback_days: 60
    limit: 0.85
    on_breach: veto

  - id: PORTFOLIO_DD_HALT
    description: >
      If shadow-portfolio drawdown from peak exceeds the limit, veto all new
      longs until drawdown recovers above `resume_at`. Exits still allowed.
    limit: 0.12
    resume_at: 0.08
    on_breach: veto

  - id: MAX_WEEKLY_TURNOVER
    description: Sum of |trade value| this ISO week may not exceed this share.
    limit: 0.30
    on_breach: veto

  - id: MAX_HOLDING_DAYS
    description: Time stop. Positions older than this are force-proposed for exit.
    limit: 120
    on_breach: exit

  - id: LONG_ONLY
    description: Any proposal with action=short is vetoed. Not configurable.
    on_breach: veto
