# Deterministic risk rules. Evaluated by code in desk/risk.py; no model is involved.
# Each rule has a stable id; verdicts cite the id and the numbers, nothing else.
# Every limit is a fraction of portfolio value unless stated. Set enabled: false
# to switch a rule off; bump `version` on any change (runs record the version).
version: 2

rules:
  - id: MAX_POSITION_PCT
    description: Single position may not exceed this share of portfolio value.
    limit: 0.15
    on_breach: resize        # resize | veto

  - id: MAX_SECTOR_PCT
    description: >
      Combined exposure to one sector (fundamentals.profile.sector from FMP) may
      not exceed this share. Not evaluated when the sector is unknown.
    limit: 0.35
    on_breach: resize

  - id: MIN_CASH_PCT
    description: Keep at least this share in cash after the proposal.
    limit: 0.10
    on_breach: resize

  - id: MAX_CORR_TO_BOOK
    description: >
      Reject a new or larger position whose daily-return correlation with the
      weighted book over lookback_days exceeds the limit. Needs price_history.
    lookback_days: 60
    limit: 0.85
    on_breach: veto

  - id: PORTFOLIO_DD_HALT
    description: >
      If the shadow book's drawdown from peak exceeds the limit, veto all new or
      larger longs until drawdown recovers above resume_at. Exits still allowed.
    limit: 0.12
    resume_at: 0.08
    on_breach: veto

  - id: MAX_WEEKLY_TURNOVER
    description: Sum of |trade value| over window_days may not exceed this share.
    window_days: 7
    limit: 0.30
    on_breach: veto

  - id: MAX_HOLDING_DAYS
    description: Time stop. Positions older than this are exited by the daily monitor.
    limit: 120
    on_breach: exit

  - id: LONG_ONLY
    description: Any proposal with action=short is vetoed. The schema does not even allow it.
    on_breach: veto
