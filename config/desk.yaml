# Phase 0 config. Everything a run needs, nothing it must not have.
# Secrets never live here: they come from /etc/desk/desk.env (see deploy/).

environment: SIM          # the only value the code accepts; see desk/guard.py

# Saxo SIM MCP server: the saxo-mcp repo's dist/http-server.js, pm2-managed,
# listening on 127.0.0.1:HTTP_PORT (default 3000). Its Host check only
# accepts localhost/127.0.0.1, so keep the loopback URL.
saxo_mcp:
  url: http://127.0.0.1:3000/mcp
  auth_style: bearer                      # saxo-mcp wants "Authorization: Bearer <MCP_ACCESS_TOKEN>"
  auth_env: SAXO_SIM_MCP_TOKEN            # name of the env var, never the token
  sim_account_keys_env: SAXO_SIM_ACCOUNT_KEYS   # comma-separated allowlist in env
  require_trading_disabled: true          # guard aborts if the MCP reports SAXO_TRADING=enabled (until phase 5)
  # Tool names exactly as registered in saxo-mcp/src/tools/*.ts.
  tools:
    account_summary: get_account_summary
    balances: get_balances
    positions: get_positions
    orders: get_orders
    search: search_instruments
    details: get_instrument_details
    price: get_instrument_price
    chart: get_chart_data

# FMP MCP server (https://site.financialmodelingprep.com/developer/docs/mcp-server).
# Its tools are grouped (company, statements, analyst, ...) and take an
# `endpoint` argument; each `fetch` entry below becomes one section of the
# data pack under fundamentals.<name>. `keep` is a field allowlist: profile and
# TTM metrics carry intraday price/volume fields that would make two same-day
# runs hash differently, so only slow-moving fields are kept. Add or remove
# fetches freely; the fundamentals analyst sees whatever is here.
fmp_mcp:
  enabled: false                          # set true once url + FMP_API_KEY are in place
  url: https://mcp.financialmodelingprep.com/mcp   # TODO: confirm against the FMP docs / your connector
  auth_style: query                       # bearer | query | header
  auth_env: FMP_API_KEY
  auth_param: apikey
  symbol_arg: symbol
  fetch:
    profile:
      tool: company
      args: {endpoint: profile-symbol}
      keep: [companyName, sector, industry, country, currency, exchange, beta, lastDividend, ipoDate, isActivelyTrading]
    metrics_ttm:
      tool: statements
      args: {endpoint: key-metrics-ttm}
      keep: [evToSalesTTM, evToEBITDATTM, evToFreeCashFlowTTM, netDebtToEBITDATTM, currentRatioTTM,
             returnOnEquityTTM, returnOnInvestedCapitalTTM, earningsYieldTTM, freeCashFlowYieldTTM,
             capexToRevenueTTM, researchAndDevelopementToRevenueTTM, incomeQualityTTM]
    ratios_ttm:
      tool: statements
      args: {endpoint: metrics-ratios-ttm}
      keep: [grossProfitMarginTTM, operatingProfitMarginTTM, netProfitMarginTTM, priceToEarningsRatioTTM,
             priceToEarningsGrowthRatioTTM, forwardPriceToEarningsGrowthRatioTTM, priceToBookRatioTTM,
             priceToSalesRatioTTM, priceToFreeCashFlowRatioTTM, debtToEquityRatioTTM, interestCoverageRatioTTM,
             dividendYieldTTM, dividendPayoutRatioTTM, freeCashFlowPerShareTTM, netIncomePerShareTTM]
    growth:
      tool: statements
      args: {endpoint: financial-statement-growth, period: annual}
      limit: 3
      keep: [fiscalYear, revenueGrowth, grossProfitGrowth, operatingIncomeGrowth, netIncomeGrowth, epsdilutedGrowth,
             operatingCashFlowGrowth, freeCashFlowGrowth, debtGrowth, threeYRevenueGrowthPerShare, threeYNetIncomeGrowthPerShare]
    price_targets:
      tool: analyst
      args: {endpoint: price-target-consensus}
      keep: [targetLow, targetConsensus, targetMedian, targetHigh]

universe:
  # Long-only US/EU large caps. A listing is identified by symbol + mic, the
  # two halves of Saxo's Symbol field (MSFT:xnas, SAPG:xetr, ASML:xams).
  # Do not use Saxo's ExchangeId here: it is an internal code that differs by
  # asset type on the same venue (Xetra stocks FSE, Xetra ETFs XETR_ETF).
  # Resolved once via search_instruments and cached in the `instruments` table.
  tickers:
    - {symbol: MSFT, mic: xnas, currency: USD}
  history_days: 250        # daily bars in the data pack (Saxo max 1200 per call)

benchmark:
  # Same start capital bought into the index ETF on the first run date.
  # SXR8 = iShares Core S&P 500 UCITS (acc), EUR on Xetra: honest for a EUR
  # account without FX noise. Use {symbol: SPY, mic: arcx, currency: USD}
  # for a USD account. Verified on SIM: SXR8:xetr is UIC 1095726, EUR.
  symbol: SXR8
  mic: xetr
  currency: EUR
  start_capital: 100000    # shadow-ledger starting capital, in account currency

storage:
  db_path: /var/lib/desk/desk.sqlite
  reports_dir: /var/lib/desk/reports     # `desk performance` charts, dated, never overwritten

# Model providers. `openai_compat` providers speak the OpenAI chat-completions
# format (Gemini exposes it; Groq and OpenAI do natively). `anthropic` uses the
# official SDK with structured output. Keys come from the named env vars.
# retries/backoff apply to 429/5xx/network errors (free tiers throw 503s).
providers:
  gemini:
    kind: openai_compat
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key_env: GEMINI_API_KEY
    retries: 3
    backoff_s: 20          # 20s, 40s, 80s
  anthropic:
    kind: anthropic
    api_key_env: ANTHROPIC_API_KEY
    retries: 2

# The roster. Add a role here and list it in pipeline.* to put it to work.
#   kind: analyst  -> produces a view per ticker (prompt: technical | fundamentals | a prompt_file)
#   kind: trader   -> weighs the views and proposes; exactly one, named in pipeline.trader
# The risk layer is code (desk/risk.py + config/risk_rules.yaml), on purpose: a
# verdict must be reproducible from numbers, never from a model's mood.
# Models are pinned to explicit versions on purpose: llm_calls.model and the
# config hash record exactly which model produced each output, and a bump is a
# deliberate, visible change. `desk discover-models <provider>` lists what a
# provider currently serves.
roles:
  technical_analyst:
    kind: analyst
    prompt: technical
    provider: gemini
    model: gemini-3.7-flash
    temperature: 0.2
    max_tokens: 1500
    price_in_per_m: 0.30      # TODO: verify against Google's current price list
    price_out_per_m: 2.50
  fundamentals_analyst:
    kind: analyst
    prompt: fundamentals
    provider: gemini
    model: gemini-3.7-flash
    temperature: 0.2
    max_tokens: 1500
    price_in_per_m: 0.30
    price_out_per_m: 2.50
  trader:
    kind: trader
    provider: anthropic
    model: claude-sonnet-5
    max_tokens: 4000
    effort: medium            # low | medium | high | xhigh | max
    price_in_per_m: 2.00
    price_out_per_m: 10.00

pipeline:
  analysts: [technical_analyst]       # add fundamentals_analyst once fmp_mcp.enabled is true
  analysts_every_run: true            # false = analysts only on decision runs
  trader: trader                      # null = no decisions, no ledger (phase 0/1 behaviour)
  decision:
    weekdays: [Mon]                   # days the trader runs; [] = every run
    min_days_between: 0               # extra guard, e.g. 7 for "at most weekly" with weekdays []
  max_attempts: 2                     # a rejected model answer is sent back once with the reasons

risk:
  rules_file: config/risk_rules.yaml  # relative to the repo root

ledger:
  fee_bps: 5                          # per fill, on traded value
  allow_fractional: true              # the shadow book may hold fractional shares
  mark: mid                           # mid | last: the quote used for fills and marking
